# 1v1 self-play: the same policy plays Team Red (Team Id 0) and Team Blue (Team Id 1).
# Scene: Assets/Scenes/SinglePlayerTesting.unity (MatchController on the GameManager object).
#
# BASE MODEL: starts from the vs-TestBrain model (576k steps) via init_path below.
# trainer_type, network_settings and the 21 observations are IDENTICAL to that run.
# Do not change them, or the checkpoint will no longer load.
#
# Run:
#   mlagents-learn config/selfplay_1v1.yaml --run-id=selfplay_1v1_01 --time-scale=20
behaviors:
  FootballAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:         # must match the base model
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    init_path: saved_models/football_vs_bot_01/FootballAgent/checkpoint.pt
    keep_checkpoints: 10
    checkpoint_interval: 250000
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 10000
    self_play:
      save_steps: 20000                     # snapshot the policy into the opponent pool this often
      team_change: 100000                   # switch which team is learning this often
      swap_steps: 2000                      # swap the opponent snapshot this often
      window: 10                            # opponent pool size
      play_against_latest_model_ratio: 0.5  # 50% vs latest policy, 50% vs older snapshots
      initial_elo: 1200.0

# Read by MatchController at runtime.
environment_parameters:
  players_per_team: 1   # keep at 1: the 21-observation agent cannot see other players
  lambda: 0.0           # no effect in 1v1
  shaping_scale: 1.0    # same shaping as the vs-bot run
