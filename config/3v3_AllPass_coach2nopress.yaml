# COACH STAGE, phase 3 "coach2nopress": Team AllPass (lambda = 1.0).
# Continues phase 2 (players AND coach start from results/3v3_AllPass_coach) for another 1M player steps and
# 20k coach decisions, with the same rules, EXCEPT that the coach may not pick Press (masked).
# In phase 2 the coaches drifted towards Press (AllPass 78%), which pulls the supporting players back next
# to the ball; without it every formation the coach can pick keeps them spread out.
# Generated by tools/make_coach_configs.py.  Run: train_3v3.ps1 -Stage coach2nopress
# NOTE: trained with role rewards that turned out to be farmable (see config/3v3_<Team>_coach3.yaml).
behaviors:
  FootballAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:         # must match the 3M models
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    init_path: results/3v3_AllPass_coach/FootballAgent/checkpoint.pt
    keep_checkpoints: 10
    checkpoint_interval: 100000
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000
    self_play:
      save_steps: 20000
      team_change: 100000     # the players' trainer decides when the learning team changes
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
  Coordinator:                # the coach: picks a formation at each decision point
    trainer_type: ppo
    init_path: results/3v3_AllPass_coach/Coordinator/checkpoint.pt
    hyperparameters:          # small-data settings: ~20k decisions in total
      batch_size: 64
      buffer_size: 512
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.95           # per decision (~3 s): looks ahead about one match
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 2000
    max_steps: 20000
    time_horizon: 64
    summary_freq: 1000
    self_play:
      save_steps: 1000
      team_change: 100000000  # never: one learning-team switch is shared by all behaviors, the players' trainer drives it
      swap_steps: 100
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

environment_parameters:
  lambda: 1.0
  shaping_scale: 0.5          # the value the 3M runs ended on
  move_gain: 2.0              # the coach models' movement outputs were halved (tools/expand_for_coach.py)
  role_hold_weight: 6.0       # role rewards: 0 from coach3 on (see HEAD_CLEAN); earlier stages used 6 / 0.1
  role_progress_weight: 0.1
  role_radius: 5.0            # in position = within 5 m of the slot
  spacing_weight: 0.0         # the spacing penalty is not used with the coach
  coach_decision_period: 3.0  # formation decisions: kick-off, possession switch, otherwise every 3 s
  coach_min_gap: 1.0          # never two formation decisions less than 1 s apart
  coach_territory_weight: 0.1 # coach reward per metre the ball moves towards the opponent goal (zero-sum)
  coach_allow_press: 0        # 1 = allowed; 0 = the coach may not pick Press (action masking)

env_settings:
  env_args: ["-coach", "learned"]

checkpoint_settings:
  run_id: 3v3_AllPass_coach2nopress
