# COACH STAGE, phase 2 "coach": Team HalfPass (lambda = 0.5).
# A learning coach (behavior "Coordinator", one per team) picks the formation every 0.5 s from the whole
# match state and is rewarded on the team result. The players keep their own policies and their own
# lambda-weighted rewards, and continue from phase 1.
# Generated by tools/make_coach_configs.py.  Run: .	rain_3v3.ps1 -Stage coach
behaviors:
  FootballAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:         # must match the 3M models
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    init_path: results/3v3_HalfPass_roles/FootballAgent/checkpoint.pt
    keep_checkpoints: 10
    checkpoint_interval: 100000
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000
    self_play:
      save_steps: 20000
      team_change: 100000     # the players' trainer decides when the learning team changes
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
  Coordinator:                # the coach: picks a formation every 0.5 s; new network
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 1024
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99           # per coach decision (0.5 s)
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 10000
    max_steps: 70000
    time_horizon: 64
    summary_freq: 2000
    self_play:
      save_steps: 2000
      team_change: 100000000  # never: one learning-team switch is shared by all behaviors, the players' trainer drives it
      swap_steps: 200
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

environment_parameters:
  lambda: 0.5
  shaping_scale: 0.5          # the value the 3M runs ended on
  move_gain: 2.0              # the coach models' movement outputs were halved (tools/expand_for_coach.py)
  role_hold_weight: 6.0       # a whole match exactly on the slot earns 6 (a goal is worth 10-15)
  role_progress_weight: 0.1   # per metre moved towards the slot
  role_radius: 5.0            # in position = within 5 m of the slot
  spacing_weight: 0.0         # the spacing penalty is not used with the coach

env_settings:
  env_args: ["-coach", "learned"]

checkpoint_settings:
  run_id: 3v3_HalfPass_coach
