# 3v3 self-play: Team HalfPass (lambda = 0.5, half the goal value for a teammate's goal).
# The three 3v3 configs (NoPass / HalfPass / AllPass) are IDENTICAL except for lambda and run_id,
# so lambda is the only difference between the three trained models.
#
# Scene:  Assets/Scenes/TeamHalfPass.unity   (build: Builds/TeamHalfPass/Football.exe)
# Base:   results/3v3_base = the 1v1 self-play model (769,635 steps) expanded to 46 observations by
#         tools/convert_to_3v3.py. At step 0 it plays exactly like the 1v1 model.
#
# Normally run by train_3v3.ps1. By hand:
#   in the Editor:  mlagents-learn config/3v3_HalfPass.yaml --time-scale=20          (then press Play)
#   resume:         mlagents-learn config/3v3_HalfPass.yaml --time-scale=20 --resume
# (--resume ignores initialize_from, so it continues this run instead of restarting from the base.)
behaviors:
  FootballAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:         # must match the base model
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995          # longer look-ahead than 1v1 (0.99): passes pay off later
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 100000
    max_steps: 1000000        # counts the 3 learning players' decisions
    time_horizon: 128
    summary_freq: 10000
    self_play:
      save_steps: 20000                     # snapshot the policy into the opponent pool this often
      team_change: 100000                   # switch which team is learning this often
      swap_steps: 2000                      # swap the opponent snapshot this often
      window: 10                            # opponent pool size
      play_against_latest_model_ratio: 0.5  # 50% vs latest policy, 50% vs older snapshots
      initial_elo: 1200.0

# Read by MatchController at every kick-off.
environment_parameters:
  lambda: 0.5
  # Dense shaping helps early on and is halved for the second half of training, so the goal
  # rewards (and so lambda) weigh more (proposal: shaping "before the sparse lambda can guide").
  # It is not removed completely: goals are rare between equal teams, and the ball-progress
  # shaping is itself split by lambda, so it carries the lambda signal every step.
  shaping_scale:
    curriculum:
      - name: FullShaping       # steps 0 - 500k
        completion_criteria:
          measure: progress
          behavior: FootballAgent
          threshold: 0.5
        value: 1.0
      - name: HalfShaping       # steps 500k - 1M
        value: 0.5

checkpoint_settings:
  run_id: 3v3_HalfPass
  initialize_from: 3v3_base
